name: ESTRUTEC - Integracao Continua

on:
  push:
    branches:
      - dev
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  backend:
    name: Backend - Testes e Cobertura
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      JWT_SECRET: chave-exclusiva-para-testes-automatizados-do-github-actions
      PUPPETEER_SKIP_DOWNLOAD: "true"

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Executar testes Jest
        run: npm test -- --coverage

      - name: Salvar cobertura do backend
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cobertura-backend
          path: backend/coverage/lcov.info
          if-no-files-found: warn


  frontend:
    name: Frontend - Testes, Cobertura e Build
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    defaults:
      run:
        working-directory: frontend

    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: "/api"

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Executar testes Jest
        run: npm run test:coverage

      - name: Verificar build de producao
        run: npm run build

      - name: Salvar cobertura do frontend
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cobertura-frontend
          path: frontend/coverage/lcov.info
          if-no-files-found: warn

  sonarqube:
    name: SonarQube Cloud - Analise de Qualidade
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    needs:
      - backend
      - frontend

    if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository)

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Baixar cobertura do backend
        uses: actions/download-artifact@v8
        with:
          name: cobertura-backend
          path: backend/coverage

      - name: Baixar cobertura do frontend
        uses: actions/download-artifact@v8
        with:
          name: cobertura-frontend
          path: frontend/coverage

      - name: Verificar arquivos de cobertura
        run: |
          test -f backend/coverage/lcov.info
          test -f frontend/coverage/lcov.info
          echo "Relatorios de cobertura encontrados!"

      - name: Executar analise SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true